name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MinGW and CMake
        shell: pwsh
        run: |
          choco install mingw cmake -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          gcc --version
          cmake --version

      - name: Build
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          ./scripts/build.ps1

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item publish/yara.exe release/yara-win-x64.exe
          Copy-Item publish/libfftw3-3.dll release/libfftw3-3.dll
          Copy-Item yara-installer/publish/yara-installer.exe release/yara-installer-win-x64.exe
          Compress-Archive -Path yara-installer/publish/yara-installer.exe -DestinationPath release/yara-installer-win-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yara-win-x64
          path: release/*

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME release/* --title $env:GITHUB_REF_NAME --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
